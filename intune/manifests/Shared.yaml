# Every multi-user / lab device. Maps to Devices-Shared.
name: Shared
catalogs:
- Production

managed_installs:
- Chrome
- Firefox

conditional_items:
# Windows 11 builds are 10.0.22000 and up. Assignment filters have no ordered
# comparison, so the condition matches the build prefix rather than >= 11.
- condition: os_version BEGINSWITH "10.0.2"
  managed_installs:
  - ExampleAppNeedingWindows11
  managed_profiles:
  - ModernOSPrefs

- condition: hostname BEGINSWITH "DESIGN"
  managed_profiles:
  - DesignLabPrefs

managed_apps:
- Company Portal

managed_profiles:
- DisableCopilot
- HideLockScreenClock
- SharedWindowsUpdateRing

managed_scripts:
- ClearSoftwareCaches

included_manifests:
- CoreManifest
