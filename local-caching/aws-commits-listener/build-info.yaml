# cimipkg build-info. ${TIMESTAMP} becomes a YYYY.MM.DD.HHMM version at build
# time, and ${SIGNING_CERT_SUBJECT} is read from the environment or a .env file
# beside this one. The payload is flat: payload/* lands directly in
# install_location.
product:
  name: CimianCommitsListener
  version: ${TIMESTAMP}
  developer: <your-org>
  identifier: com.example.cimian.CommitsListener
  category: Management
  description: >-
    AWS SQS listener for a Windows Cimian caching server. On a commit event it
    runs git pull + aws s3 sync to refresh the local deployment tree.
    Sample/template — all connection details are env-driven, none are baked in.
install_location: 'C:\Program Files\CimianCommitsListener'
postinstall_action: none
signing_certificate: ${SIGNING_CERT_SUBJECT}
