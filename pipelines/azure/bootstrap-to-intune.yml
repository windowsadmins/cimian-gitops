# ──────────────────────────────────────────────────────────────────────────────
#  bootstrap-to-intune.yml — push the BootstrapMate stack to Intune as a Win32 LOB
#
#  This is the "MDM as a dumb approved pipe" pattern. Intune does ONE job: deliver
#  a single signed bootstrapper (BootstrapMate) to a freshly-enrolled device during
#  the Enrollment Status Page. Everything else — the actual app stack, configs,
#  patch state — is orchestrated by Cimian pulling from the GitOps repo, NOT by
#  Intune. The MDM never sees the package catalog; it only ever delivers the pipe.
#
#  What this pipeline does, end to end:
#    1. Build    — fetch the BootstrapMate MSI from its GitHub release, re-sign it
#                  with the org cert, and wrap it into an .intunewin.
#    2. Publish  — upload provisioning/public/management.json (the BootstrapMate
#                  manifest that lists the first-boot payload) to blob storage and
#                  purge the CDN so devices see it immediately.
#    3. Deploy   — replace the Win32 LOB in Intune via Microsoft Graph, assign it to
#                  a device group, and repoint the ESP blocking list at the new app.
#
#  Auth is the service connection's workload identity federation: no client
#  secret. The identity needs Key Vault Secrets User on the signing vault,
#  Storage Blob Data Contributor on the storage account, CDN Endpoint Contributor
#  on the Front Door profile, and the Graph application permissions
#  DeviceManagementApps.ReadWrite.All and DeviceManagementServiceConfig.ReadWrite.All.
#
#  Every name in the variables block is a placeholder. The GitHub Actions / S3
#  twin is ../github/bootstrap-to-intune.yml; both share
#  ../scripts/Publish-IntuneWin32App.ps1 for the Graph upload.
# ──────────────────────────────────────────────────────────────────────────────

trigger: none          # release-style: run by hand or on a schedule, not on push

parameters:
  - name: stages
    displayName: "Stage(s) to run"
    type: string
    default: Full
    values:
      - Full            # Build + Publish + Deploy
      - Build           # fetch + sign + wrap .intunewin only
      - Publish         # management.json upload + CDN purge
      - Deploy          # Build + Win32 LOB to Intune + assignment + ESP

  # A release tag such as v2026.10.05.1229, or latest. Assets carry the version
  # in their name (BootstrapMate-x64-<version>.msi), so the lookup is by glob.
  - name: bootstrapMateTag
    displayName: "BootstrapMate release tag (bootstrapmate/bootstrapmate-windows)"
    type: string
    default: latest

  - name: assignmentGroupId
    displayName: "Entra group object ID to assign the Win32 app to"
    type: string
    default: '<entra-group-object-id>'

  # The Enrollment Status Page profile that should block on BootstrapMate. Leave
  # empty to skip the ESP repair.
  - name: espName
    displayName: "ESP profile name"
    type: string
    default: 'Management Bootstrap'

pool:
  vmImage: windows-latest

variables:
  - group: cimian-repo-secrets            # GitHubReadToken (public-repo read)

  - name: azureServiceConnection          # workload identity federation
    value: '<ado-service-connection>'

  # Code-signing cert, stored base64 (PFX bytes) as a Key Vault secret.
  - name: signingKeyVault
    value: '<signing-key-vault>'
  - name: signingCertName
    value: '<signing-cert-secret-name>'

  - name: storageAccount
    value: 'examplecimianstorage'
  # The anonymous-read container BootstrapMate fetches from before the
  # machine has any credential; see infrastructure/main.tf.
  - name: storageContainer
    value: 'public'
  - name: managementJsonUrl
    value: 'https://cimian.example.com/bootstrap/management.json'

  - name: cdnResourceGroup
    value: '<resource-group>'
  - name: cdnProfile
    value: '<frontdoor-profile>'
  - name: cdnEndpoint
    value: '<frontdoor-endpoint>'

# Every parameter and variable reaches a script through env: and is read as
# $env:X. Nothing is pasted into script text by template or macro expansion, so
# a crafted value cannot become code. The inputs are also checked for shape
# before anything runs.

stages:

# ── 1. Build ──────────────────────────────────────────────────────────────────
- ${{ if in(parameters.stages, 'Full', 'Build', 'Deploy') }}:
  - stage: Build
    displayName: "Fetch + sign BootstrapMate, build .intunewin"
    jobs:
    - job: build_bootstrapmate
      steps:
      - pwsh: |
          $ErrorActionPreference = 'Stop'
          if ($env:BM_TAG -notmatch '^(latest|v?\d{4}\.\d{2}\.\d{2}\.\d{4})$') { throw "bootstrapMateTag '$env:BM_TAG' is not 'latest' or a release tag" }
          if ($env:ASSIGN_GROUP_ID -notmatch '^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$') { throw 'assignmentGroupId is not a GUID' }
          if ($env:ESP_NAME -notmatch '^[A-Za-z0-9 ._()-]{0,128}$') { throw 'espName may only contain letters, digits, spaces and ._()-' }
        displayName: 'Validate parameters'
        env:
          BM_TAG: ${{ parameters.bootstrapMateTag }}
          ASSIGN_GROUP_ID: ${{ parameters.assignmentGroupId }}
          ESP_NAME: ${{ parameters.espName }}

      - pwsh: |
          $ErrorActionPreference = 'Stop'
          . (Join-Path $env:BUILD_SOURCESDIRECTORY 'pipelines/scripts/GitHubRelease.ps1')
          $out = Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'intune'
          $got = Get-GitHubReleaseAsset -Owner 'bootstrapmate' -Repo 'bootstrapmate-windows' `
            -Tag $env:BM_TAG -AssetGlob 'BootstrapMate-x64-*.msi' -DestDir $out
          Write-Host "Fetched $($got.Name) from $($got.Tag)"
        displayName: 'Fetch BootstrapMate x64 MSI'
        env:
          BM_TAG: ${{ parameters.bootstrapMateTag }}
          GITHUB_TOKEN: $(GitHubReadToken)

      - task: AzureCLI@2
        displayName: 'Sign BootstrapMate MSI'
        env:
          SIGNING_VAULT: $(signingKeyVault)
          SIGNING_CERT_NAME: $(signingCertName)
        inputs:
          azureSubscription: '$(azureServiceConnection)'
          scriptType: pscore
          scriptLocation: inlineScript
          inlineScript: |
            $ErrorActionPreference = 'Stop'
            $msi = Get-ChildItem (Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'intune') -Filter 'BootstrapMate-x64-*.msi' | Select-Object -First 1
            if (-not $msi) { throw 'No BootstrapMate MSI to sign' }
            $b64 = az keyvault secret show --vault-name $env:SIGNING_VAULT --name $env:SIGNING_CERT_NAME --query value -o tsv
            if ($LASTEXITCODE -ne 0 -or -not $b64) { throw "Could not read secret $env:SIGNING_CERT_NAME from $env:SIGNING_VAULT" }
            $pfx = Join-Path $env:AGENT_TEMPDIRECTORY 'signing.pfx'
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($b64))
            try { $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My }
            finally { Remove-Item $pfx -Force }

            $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
              Where-Object FullName -like '*\x64\*' | Sort-Object FullName -Descending | Select-Object -First 1
            if (-not $signtool) { throw 'signtool.exe not found on the agent' }

            # A timestamp server that is down fails the sign, not the build:
            # try the next one before giving up.
            $signed = $false
            foreach ($tsa in 'http://timestamp.digicert.com', 'http://timestamp.sectigo.com', 'http://timestamp.globalsign.com/tsa/r6advanced1') {
              & $signtool.FullName sign /sha1 $cert.Thumbprint /fd SHA256 /tr $tsa /td SHA256 /q $msi.FullName
              if ($LASTEXITCODE -eq 0) { $signed = $true; Write-Host "Signed, timestamped by $tsa"; break }
              Write-Host "signtool failed with $tsa ($LASTEXITCODE); trying the next server"
            }
            if (-not $signed) { throw 'Signing failed against every timestamp server' }
            if ((Get-AuthenticodeSignature $msi.FullName).Status -ne 'Valid') { throw 'The signed MSI does not verify' }

      - pwsh: |
          $ErrorActionPreference = 'Stop'
          $tool = Join-Path $env:AGENT_TEMPDIRECTORY 'IntuneWinAppUtil.exe'
          Invoke-WebRequest -UseBasicParsing -OutFile $tool `
            'https://github.com/microsoft/Microsoft-Win32-Content-Prep-Tool/raw/master/IntuneWinAppUtil.exe'
          $msi = Get-ChildItem (Join-Path $env:BUILD_ARTIFACTSTAGINGDIRECTORY 'intune') -Filter 'BootstrapMate-x64-*.msi' | Select-Object -First 1
          & $tool -c $msi.DirectoryName -s $msi.FullName -o $msi.DirectoryName -q
          if ($LASTEXITCODE -ne 0) { throw "IntuneWinAppUtil failed ($LASTEXITCODE)" }
          Get-ChildItem "$($msi.DirectoryName)/*.intunewin" | ForEach-Object { Write-Host "Built $($_.Name)" }
        displayName: 'Build .intunewin'

      - task: PublishPipelineArtifact@1
        inputs:
          targetPath: '$(Build.ArtifactStagingDirectory)/intune'
          artifact: 'bootstrapmate-intune'

# ── 2. Publish ────────────────────────────────────────────────────────────────
- ${{ if in(parameters.stages, 'Full', 'Publish') }}:
  - stage: Publish
    displayName: "Upload management.json + purge CDN"
    dependsOn: []
    jobs:
    - job: publish_manifest
      steps:
      - task: AzureCLI@2
        displayName: 'Upload management.json, purge CDN'
        env:
          STORAGE_ACCOUNT: $(storageAccount)
          STORAGE_CONTAINER: $(storageContainer)
          CDN_RG: $(cdnResourceGroup)
          CDN_PROFILE: $(cdnProfile)
          CDN_ENDPOINT: $(cdnEndpoint)
          MANAGEMENT_JSON_URL: $(managementJsonUrl)
        inputs:
          azureSubscription: '$(azureServiceConnection)'
          scriptType: pscore
          scriptLocation: inlineScript
          inlineScript: |
            $ErrorActionPreference = 'Stop'
            # management.json is the first-boot manifest BootstrapMate reads at
            # the ESP. It lists only what must land before the desktop appears;
            # Cimian pulls the full app stack afterward. See provisioning/README.md.
            $manifest = Join-Path $env:BUILD_SOURCESDIRECTORY 'provisioning/public/management.json'
            $want = Get-Content $manifest -Raw | ConvertFrom-Json | ConvertTo-Json -Depth 20 -Compress   # refuses invalid JSON

            for ($try = 1; ; $try++) {
              az storage blob upload --auth-mode login `
                --account-name $env:STORAGE_ACCOUNT --container-name $env:STORAGE_CONTAINER `
                --name 'bootstrap/management.json' --file $manifest `
                --content-type 'application/json' --overwrite true
              if ($LASTEXITCODE -eq 0) { break }
              if ($try -ge 4) { throw "management.json upload failed after $try attempts" }
              Start-Sleep -Seconds (10 * $try)
            }

            az afd endpoint purge `
              --resource-group $env:CDN_RG --profile-name $env:CDN_PROFILE `
              --endpoint-name $env:CDN_ENDPOINT --content-paths '/bootstrap/management.json'
            if ($LASTEXITCODE -ne 0) { throw "CDN purge failed ($LASTEXITCODE)" }

            # Prove the edge now serves what was uploaded.
            $have = Invoke-RestMethod -Uri "$($env:MANAGEMENT_JSON_URL)?nocache=$($env:BUILD_BUILDID)" | ConvertTo-Json -Depth 20 -Compress
            if ($want -ne $have) { throw "$env:MANAGEMENT_JSON_URL does not match the repo copy after the purge" }
            Write-Host "Verified $env:MANAGEMENT_JSON_URL"

# ── 3. Deploy ─────────────────────────────────────────────────────────────────
- ${{ if in(parameters.stages, 'Full', 'Deploy') }}:
  - stage: Deploy
    displayName: "Win32 LOB to Intune + assign + ESP"
    dependsOn: Build
    jobs:
    - job: deploy_intune
      steps:
      - download: current
        artifact: bootstrapmate-intune

      - task: AzureCLI@2
        displayName: 'Publish Win32 LOB'
        env:
          ASSIGN_GROUP_ID: ${{ parameters.assignmentGroupId }}
          ESP_NAME: ${{ parameters.espName }}
        inputs:
          azureSubscription: '$(azureServiceConnection)'
          scriptType: pscore
          scriptLocation: inlineScript
          inlineScript: |
            $ErrorActionPreference = 'Stop'
            $token = az account get-access-token --resource 'https://graph.microsoft.com' --query accessToken -o tsv
            if ($LASTEXITCODE -ne 0 -or -not $token) { throw 'Could not get a Graph token for the service connection' }
            $intuneWin = Get-ChildItem (Join-Path $env:PIPELINE_WORKSPACE 'bootstrapmate-intune') -Filter '*.intunewin' -Recurse | Select-Object -First 1
            if (-not $intuneWin) { throw 'No .intunewin in the build artifact' }
            & (Join-Path $env:BUILD_SOURCESDIRECTORY 'pipelines/scripts/Publish-IntuneWin32App.ps1') `
              -Token $token -IntuneWin $intuneWin.FullName -DisplayName 'BootstrapMate' `
              -AssignmentGroupId $env:ASSIGN_GROUP_ID -EspName $env:ESP_NAME
