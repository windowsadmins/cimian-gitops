# ──────────────────────────────────────────────────────────────────────────────
#  infrastructure.yml — plan and apply ../../infrastructure with Terraform.
#
#  Plan runs on every change. Apply runs only from main, through a deployment
#  job on the "cimian-infrastructure" environment: add an Approvals check to
#  that environment (Pipelines > Environments) and the apply waits for a person
#  to read the plan. The apply uses the exact plan file the Plan stage saved.
#
#  For pull requests in Azure Repos, add this pipeline as a build validation
#  policy on main; the pr: block below only applies to GitHub-hosted repos.
#
#  Auth is the service connection's workload identity federation. AzureCLI@2
#  with addSpnToEnvironment exposes the federated token, which Terraform uses
#  through ARM_USE_OIDC. No client secret, no storage account key.
#
#  Every value reaches scripts through env:, never pasted into script text.
# ──────────────────────────────────────────────────────────────────────────────

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - infrastructure/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - infrastructure/**

# Reissue the client SAS before it nears expiry, even when nothing changed.
schedules:
  - cron: '0 6 1 * *'
    displayName: Monthly reconcile
    branches:
      include:
        - main
    always: true

pool:
  vmImage: ubuntu-latest

variables:
  - name: azureServiceConnection          # workload identity federation
    value: '<ado-service-connection>'
  - name: terraformVersion
    value: '1.9.8'
  # State backend, created outside this configuration.
  - name: TF_STATE_RESOURCE_GROUP
    value: '<state-resource-group>'
  - name: TF_STATE_STORAGE_ACCOUNT
    value: '<state-storage-account>'
  - name: TF_STATE_CONTAINER
    value: 'tfstate'
  - name: TF_STATE_KEY
    value: 'cimian.tfstate'
  # Inputs to the configuration. Anything not set here takes its default.
  - name: TF_VAR_pipeline_principal_id
    value: '<pipeline-identity-object-id>'
  - name: TF_VAR_storage_account_name
    value: 'examplecimianstorage'

stages:
- stage: Plan
  jobs:
  - job: plan
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: Terraform plan
      env:
        TF_VERSION: $(terraformVersion)
        STATE_RG: $(TF_STATE_RESOURCE_GROUP)
        STATE_SA: $(TF_STATE_STORAGE_ACCOUNT)
        STATE_CONTAINER: $(TF_STATE_CONTAINER)
        STATE_KEY: $(TF_STATE_KEY)
        TF_VAR_pipeline_principal_id: $(TF_VAR_pipeline_principal_id)
        TF_VAR_storage_account_name: $(TF_VAR_storage_account_name)
        TF_IN_AUTOMATION: 'true'
      inputs:
        azureSubscription: $(azureServiceConnection)
        addSpnToEnvironment: true
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: infrastructure
        inlineScript: |
          set -euo pipefail
          curl -fsSL -o /tmp/tf.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
          sudo unzip -o -q /tmp/tf.zip -d /usr/local/bin

          export ARM_USE_OIDC=true ARM_OIDC_TOKEN="$idToken" ARM_CLIENT_ID="$servicePrincipalId" ARM_TENANT_ID="$tenantId"
          export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

          terraform init -input=false \
            -backend-config="resource_group_name=$STATE_RG" \
            -backend-config="storage_account_name=$STATE_SA" \
            -backend-config="container_name=$STATE_CONTAINER" \
            -backend-config="key=$STATE_KEY"
          terraform fmt -check -recursive
          terraform validate
          set +e
          terraform plan -input=false -lock-timeout=300s -detailed-exitcode -out=tfplan
          rc=$?
          set -e
          case $rc in
            0) echo "No changes."; echo "##vso[task.setvariable variable=hasChanges;isOutput=true]false" ;;
            2) echo "##vso[task.setvariable variable=hasChanges;isOutput=true]true" ;;
            *) exit $rc ;;
          esac
      name: tf

    - publish: infrastructure/tfplan
      artifact: tfplan
      condition: and(succeeded(), eq(variables['tf.hasChanges'], 'true'))

- stage: Apply
  dependsOn: Plan
  condition: >-
    and(succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        ne(variables['Build.Reason'], 'PullRequest'),
        eq(dependencies.Plan.outputs['plan.tf.hasChanges'], 'true'))
  jobs:
  - deployment: apply
    environment: cimian-infrastructure    # add an Approvals check here
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self
          - download: current
            artifact: tfplan

          - task: AzureCLI@2
            displayName: Terraform apply
            env:
              TF_VERSION: $(terraformVersion)
              STATE_RG: $(TF_STATE_RESOURCE_GROUP)
              STATE_SA: $(TF_STATE_STORAGE_ACCOUNT)
              STATE_CONTAINER: $(TF_STATE_CONTAINER)
              STATE_KEY: $(TF_STATE_KEY)
              PLAN_FILE: $(Pipeline.Workspace)/tfplan/tfplan
              TF_IN_AUTOMATION: 'true'
            inputs:
              azureSubscription: $(azureServiceConnection)
              addSpnToEnvironment: true
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: infrastructure
              inlineScript: |
                set -euo pipefail
                curl -fsSL -o /tmp/tf.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
                sudo unzip -o -q /tmp/tf.zip -d /usr/local/bin

                export ARM_USE_OIDC=true ARM_OIDC_TOKEN="$idToken" ARM_CLIENT_ID="$servicePrincipalId" ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                terraform init -input=false \
                  -backend-config="resource_group_name=$STATE_RG" \
                  -backend-config="storage_account_name=$STATE_SA" \
                  -backend-config="container_name=$STATE_CONTAINER" \
                  -backend-config="key=$STATE_KEY"
                # Applying the saved plan fails if state moved since it was
                # made, so what was approved is exactly what runs.
                terraform apply -input=false -lock-timeout=300s "$PLAN_FILE"
