# ──────────────────────────────────────────────────────────────────────────────
#  infrastructure.yml — check and apply ../../infrastructure with Terraform.
#
#  Two stages, split by trust:
#    Check  Every run, including pull request validation. fmt and validate
#           with `init -backend=false`. No service connection and no state.
#    Apply  main only, as a deployment job on the "cimian-infrastructure"
#           environment. Add an Approvals check to that environment
#           (Pipelines > Environments). The job plans and applies in one go.
#           The plan holds the client token and SAS in plain text, so it is
#           never published as an artifact.
#
#  A pull request build runs the YAML from the pull request, so a condition in
#  this file cannot keep it away from the service connection. Add a Branch
#  control check on the service connection allowing only refs/heads/main;
#  that check is what actually keeps pull requests from state and Key Vault.
#
#  Auth is the service connection's workload identity federation. AzureCLI@2
#  with addSpnToEnvironment exposes the federated token, which Terraform uses
#  through ARM_USE_OIDC. No client secret, no storage account key.
#
#  Every value reaches scripts through env:, never pasted into script text.
# ──────────────────────────────────────────────────────────────────────────────

trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - infrastructure/**

# For Azure Repos, add this pipeline as a build validation policy on main;
# the pr: block only applies to GitHub-hosted repos.
pr:
  branches:
    include:
      - main
  paths:
    include:
      - infrastructure/**

# Reissue the client SAS before it nears expiry, even when nothing changed.
schedules:
  - cron: '0 6 1 * *'
    displayName: Monthly reconcile
    branches:
      include:
        - main
    always: true

pool:
  vmImage: ubuntu-latest

variables:
  - name: azureServiceConnection          # workload identity federation; main-only branch control check
    value: '<ado-service-connection>'
  - name: terraformVersion
    value: '1.9.8'
  # State backend, created outside this configuration.
  - name: TF_STATE_RESOURCE_GROUP
    value: '<state-resource-group>'
  - name: TF_STATE_STORAGE_ACCOUNT
    value: '<state-storage-account>'
  - name: TF_STATE_CONTAINER
    value: 'tfstate'
  - name: TF_STATE_KEY
    value: 'cimian.tfstate'
  # Inputs to the configuration. Anything not set here takes its default.
  - name: TF_VAR_pipeline_principal_id
    value: '<pipeline-identity-object-id>'
  - name: TF_VAR_storage_account_name
    value: 'examplecimianstorage'

stages:
- stage: Check
  jobs:
  - job: check
    steps:
    - checkout: self

    - bash: |
        set -euo pipefail
        curl -fsSL -o /tmp/tf.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
        sudo unzip -o -q /tmp/tf.zip -d /usr/local/bin
        terraform fmt -check -recursive
        terraform init -backend=false -input=false
        terraform validate
      displayName: Format, init without backend, validate
      workingDirectory: infrastructure
      env:
        TF_VERSION: $(terraformVersion)
        TF_IN_AUTOMATION: 'true'

- stage: Apply
  dependsOn: Check
  condition: >-
    and(succeeded(),
        eq(variables['Build.SourceBranch'], 'refs/heads/main'),
        ne(variables['Build.Reason'], 'PullRequest'))
  jobs:
  - deployment: apply
    environment: cimian-infrastructure    # add an Approvals check here
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self

          - task: AzureCLI@2
            displayName: Terraform plan and apply
            env:
              TF_VERSION: $(terraformVersion)
              STATE_RG: $(TF_STATE_RESOURCE_GROUP)
              STATE_SA: $(TF_STATE_STORAGE_ACCOUNT)
              STATE_CONTAINER: $(TF_STATE_CONTAINER)
              STATE_KEY: $(TF_STATE_KEY)
              TF_VAR_pipeline_principal_id: $(TF_VAR_pipeline_principal_id)
              TF_VAR_storage_account_name: $(TF_VAR_storage_account_name)
              TF_IN_AUTOMATION: 'true'
            inputs:
              azureSubscription: $(azureServiceConnection)
              addSpnToEnvironment: true
              scriptType: bash
              scriptLocation: inlineScript
              workingDirectory: $(Build.SourcesDirectory)/infrastructure
              inlineScript: |
                set -euo pipefail
                curl -fsSL -o /tmp/tf.zip "https://releases.hashicorp.com/terraform/${TF_VERSION}/terraform_${TF_VERSION}_linux_amd64.zip"
                sudo unzip -o -q /tmp/tf.zip -d /usr/local/bin

                export ARM_USE_OIDC=true ARM_OIDC_TOKEN="$idToken" ARM_CLIENT_ID="$servicePrincipalId" ARM_TENANT_ID="$tenantId"
                export ARM_SUBSCRIPTION_ID="$(az account show --query id -o tsv)"

                terraform init -input=false \
                  -backend-config="resource_group_name=$STATE_RG" \
                  -backend-config="storage_account_name=$STATE_SA" \
                  -backend-config="container_name=$STATE_CONTAINER" \
                  -backend-config="key=$STATE_KEY"

                # The approval gates this job, and the plan printed here is the
                # record of what was applied. Sensitive values print as
                # (sensitive value). The plan file never leaves the agent.
                plan="$AGENT_TEMPDIRECTORY/tfplan"
                set +e
                terraform plan -input=false -lock-timeout=300s -detailed-exitcode -out="$plan"
                rc=$?
                set -e
                case $rc in
                  0) echo "No changes." ;;
                  2) terraform apply -input=false -lock-timeout=300s "$plan" ;;
                  *) exit $rc ;;
                esac
                rm -f "$plan"
