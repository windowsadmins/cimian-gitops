# ──────────────────────────────────────────────────────────────────────────────
#  push-to-production-aws.yml — publish the Cimian repo to S3 + CloudFront.
#
#  Same flow as push-to-production-azure.yml with S3 and CloudFront as the
#  backend. Runs on an Azure DevOps Windows agent so makecatalogs runs natively.
#
#  Auth: an AWS Toolkit service connection. Configure it to assume a role with
#  OIDC ("Use OIDC" on the connection) rather than storing an access key; the
#  role needs s3:ListBucket, s3:PutObject, s3:DeleteObject on the bucket and
#  cloudfront:CreateInvalidation on the distribution. Every name below is a
#  placeholder.
# ──────────────────────────────────────────────────────────────────────────────

# batch: a run never starts beside its predecessor from CI.
trigger:
  batch: true
  branches:
    include:
      - main
  paths:
    include:
      - /deployment/**
      - /installers/**

pool:
  vmImage: windows-latest

variables:
  - group: cimian-repo-secrets            # GitHubReadToken (public-repo read)
  - name: awsServiceConnection
    value: '<aws-service-connection>'
  - name: AWS_REGION
    value: '<region>'
  - name: S3_BUCKET
    value: '<your-bucket>'
  - name: CLOUDFRONT_DISTRIBUTION_ID
    value: '<distribution-id>'
  - name: CIMIAN_TOOLS_TAG
    value: '2026.09.18.1356'
  # SHA-256 of that release's CimianTools-x64 nupkg. Change it with the tag.
  - name: CIMIAN_TOOLS_SHA256
    value: 'e6824a09095e4d1f86cff99469bb96f49b5b597fdbbab157139e97b933b73f71'
  - name: TOOLS_DIR
    value: '$(Agent.TempDirectory)/cimian-tools'
  - name: REPO_PATH
    value: '$(Build.SourcesDirectory)/deployment'

stages:
- stage: PushCimianRepo
  jobs:
  - job: CloudDeploy
    steps:
    - checkout: self
      clean: true
      fetchDepth: 2

    # See push-to-production-azure.yml: a run queued by hand would otherwise
    # start beside an in-flight one. Fails open.
    - pwsh: |
        $me = [int]$env:BUILD_BUILDID
        $project = [Uri]::EscapeDataString($env:SYSTEM_TEAMPROJECT)
        $uri = "$($env:SYSTEM_COLLECTIONURI)$project/_apis/build/builds?definitions=$($env:SYSTEM_DEFINITIONID)&statusFilter=inProgress,notStarted&api-version=7.1"
        $headers = @{ Authorization = "Bearer $env:SYSTEM_ACCESSTOKEN" }
        $deadline = (Get-Date).AddMinutes(40)
        $failures = 0
        while ($true) {
          try {
            $runs = @((Invoke-RestMethod -Uri $uri -Headers $headers).value)
          } catch {
            if (++$failures -ge 3) {
              Write-Host "##vso[task.logissue type=warning]Could not list earlier runs ($($_.Exception.Message)); continuing without the overlap guard."
              break
            }
            Start-Sleep -Seconds 10; continue
          }
          $ahead = @($runs | Where-Object { [int]$_.id -lt $me } | ForEach-Object { $_.id })
          if ($ahead.Count -eq 0) { Write-Host 'No earlier run is active.'; break }
          if ((Get-Date) -gt $deadline) { throw "Earlier run(s) $($ahead -join ', ') still active after 40 minutes." }
          Write-Host "Waiting for earlier run(s) $($ahead -join ', ')..."
          Start-Sleep -Seconds 20
        }
      displayName: Wait for earlier runs
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)

    - pwsh: |
        & '$(Build.SourcesDirectory)/pipelines/scripts/Install-CimianTools.ps1' -Tag '$(CIMIAN_TOOLS_TAG)' -Sha256 '$(CIMIAN_TOOLS_SHA256)' -Destination '$(TOOLS_DIR)' -Tools makecatalogs.exe
      displayName: Install pinned makecatalogs
      env:
        GITHUB_TOKEN: $(GitHubReadToken)

    - pwsh: |
        & '$(TOOLS_DIR)/makecatalogs.exe' --repo_path '$(REPO_PATH)'
        if ($LASTEXITCODE -ne 0) { throw "makecatalogs failed ($LASTEXITCODE)" }
        if (-not (Get-ChildItem '$(REPO_PATH)/catalogs' -Filter *.yaml -ErrorAction SilentlyContinue)) {
          throw 'makecatalogs wrote no catalogs'
        }
      displayName: Run makecatalogs

    - task: AWSPowerShellModuleScript@1
      displayName: 'Gate: every pkgsinfo location exists in S3'
      inputs:
        awsCredentials: $(awsServiceConnection)
        regionName: $(AWS_REGION)
        scriptType: inline
        inlineScript: |
          $inv = Join-Path '$(Agent.TempDirectory)' 'pkgs-inventory.txt'
          aws s3api list-objects-v2 --bucket '$(S3_BUCKET)' --prefix 'deployment/pkgs/' `
            --query 'Contents[].Key' --output text |
            ForEach-Object { $_ -split "`t" } | Where-Object { $_ -and $_ -ne 'None' } |
            Set-Content -LiteralPath $inv
          if ($LASTEXITCODE -ne 0) { throw 'Could not list deployment/pkgs in S3.' }
          & '$(Build.SourcesDirectory)/pipelines/scripts/Test-PackagesPresent.ps1' -RepoPath '$(REPO_PATH)' -InventoryFile $inv

    # Metadata trees mirror git exactly (--delete); packages and source trees
    # are only ever added to.
    - task: AWSPowerShellModuleScript@1
      displayName: Sync to S3
      inputs:
        awsCredentials: $(awsServiceConnection)
        regionName: $(AWS_REGION)
        scriptType: inline
        inlineScript: |
          $ErrorActionPreference = 'Stop'
          function Sync($src, $dest, [bool] $mirror) {
            if (-not (Test-Path $src)) { Write-Host "Skipping $src (not in this repo)"; return }
            $extra = if ($mirror) { @('--delete') } else { @() }
            aws s3 sync $src "s3://$(S3_BUCKET)/$dest" @extra
            if ($LASTEXITCODE -ne 0) { throw "aws s3 sync $src failed ($LASTEXITCODE)" }
          }
          foreach ($d in 'catalogs', 'manifests', 'pkgsinfo', 'icons') {
            Sync "$(REPO_PATH)/$d" "deployment/$d" $true
          }
          Sync '$(REPO_PATH)/pkgs' 'deployment/pkgs' $false
          Sync '$(Build.SourcesDirectory)/installers' 'installers' $false
          Sync '$(Build.SourcesDirectory)/packages' 'packages' $false

    # Metadata only. Packages are version-named and never stale at the edge.
    - task: AWSPowerShellModuleScript@1
      displayName: Invalidate CloudFront (metadata only)
      inputs:
        awsCredentials: $(awsServiceConnection)
        regionName: $(AWS_REGION)
        scriptType: inline
        inlineScript: |
          aws cloudfront create-invalidation --distribution-id '$(CLOUDFRONT_DISTRIBUTION_ID)' `
            --paths '/deployment/catalogs/*' '/deployment/manifests/*' '/deployment/pkgsinfo/*' '/deployment/icons/*'
          if ($LASTEXITCODE -ne 0) { throw "CloudFront invalidation failed ($LASTEXITCODE)" }
