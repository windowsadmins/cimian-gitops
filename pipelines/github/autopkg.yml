# autopkg.yml — GitHub Actions twin of ../azure/autopkg.yml.
#
# Runs the recipes in promotion/recipe_list.yaml, stamps the new pkgsinfo for
# the promoter, uploads the packages add-only to Azure Blob, and commits the
# pkgsinfo to main. Storage auth is OpenID Connect (see push-to-production-azure.yml
# for the federated credential). For S3, swap the login and upload steps for
# aws-actions/configure-aws-credentials and `aws s3 sync deployment/pkgs ...`
# without --delete.
#
# The commit is pushed with GITHUB_TOKEN, which does not start other
# workflows. Use a GitHub App token if push-to-production should run on it
# without a manual dispatch.

name: AutoPkg

on:
  schedule:
    - cron: '0 14 * * 1-5'
  workflow_dispatch:
    inputs:
      recipes:
        description: 'Recipe identifiers, comma-separated (blank runs the whole list)'
        type: string
        default: ''

concurrency:
  group: autopkg
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  STORAGE_ACCOUNT: ${{ vars.STORAGE_ACCOUNT }}
  STORAGE_CONTAINER: ${{ vars.STORAGE_CONTAINER }}
  CIMIAN_TOOLS_TAG: '2026.09.18.1356'
  CIMIAN_TOOLS_SHA256: 'e6824a09095e4d1f86cff99469bb96f49b5b597fdbbab157139e97b933b73f71'

jobs:
  autopkg:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cimiimport
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./pipelines/scripts/Install-CimianTools.ps1 -Tag $env:CIMIAN_TOOLS_TAG -Sha256 $env:CIMIAN_TOOLS_SHA256 -Destination "$env:RUNNER_TEMP/cimian-tools" -Tools cimiimport.exe

      - name: Run AutoPkg
        id: run
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RECIPES: ${{ inputs.recipes }}
        run: |
          $recipes = @($env:RECIPES -split ',' | ForEach-Object { $_.Trim() } | Where-Object { $_ })
          $params = @{
            RepoRoot       = $env:GITHUB_WORKSPACE
            CimiimportPath = "$env:RUNNER_TEMP/cimian-tools/cimiimport.exe"
            WorkDir        = "$env:RUNNER_TEMP/autopkg"
          }
          if ($recipes) { $params.Recipes = $recipes }
          ./promotion/Invoke-AutoPkgRun.ps1 @params
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::warning::Some recipes failed'
            "failed=true" | Out-File -Append $env:GITHUB_OUTPUT
          }
          exit 0

      - name: Stamp metadata
        id: stamp
        shell: pwsh
        run: |
          python promotion/stamp_metadata.py --repo $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'stamp_metadata failed' }
          git add -A deployment/pkgsinfo
          git diff --cached --quiet
          "imports=$($LASTEXITCODE -ne 0)" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Azure login (OIDC)
        if: steps.stamp.outputs.imports == 'True'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Upload new packages
        if: steps.stamp.outputs.imports == 'True'
        shell: pwsh
        run: ./pipelines/scripts/Sync-RepoToBlob.ps1 -StorageAccount $env:STORAGE_ACCOUNT -Container $env:STORAGE_CONTAINER -RepoRoot $env:GITHUB_WORKSPACE -PackagesOnly

      - name: Commit imports
        if: steps.stamp.outputs.imports == 'True'
        shell: pwsh
        run: |
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config user.name 'github-actions[bot]'
          git commit -qm "AutoPkg imports $(Get-Date -AsUTC -Format yyyy-MM-dd)"
          foreach ($try in 1..3) {
            git pull --rebase -q origin main
            if ($LASTEXITCODE -eq 0) { git push origin HEAD:main; if ($LASTEXITCODE -eq 0) { exit 0 } }
            Start-Sleep -Seconds (10 * $try)
          }
          throw 'Could not push the import commit'

      - name: Fail if any recipe failed
        if: steps.run.outputs.failed == 'true'
        shell: pwsh
        run: throw 'One or more recipes failed; see the Run AutoPkg step.'
