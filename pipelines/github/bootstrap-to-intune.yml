# bootstrap-to-intune.yml — GitHub Actions twin of ../azure/bootstrap-to-intune.yml.
#
# Same "MDM as a dumb approved pipe" pattern: Intune delivers ONE signed
# bootstrapper (BootstrapMate) at the Enrollment Status Page; Cimian pulls the
# real app stack from the GitOps repo afterward.
#
# The one difference from the Azure form: management.json is hosted on S3 +
# CloudFront instead of Azure Blob + Front Door. Intune is Microsoft-only, so the
# Win32 LOB still goes up through Microsoft Graph either way, using the same
# ../scripts/Publish-IntuneWin32App.ps1.
#
# Auth is OpenID Connect throughout, with no stored keys or client secrets:
#   - Azure: a federated credential on an app registration for this repo, with
#     the Graph application permissions DeviceManagementApps.ReadWrite.All and
#     DeviceManagementServiceConfig.ReadWrite.All.
#   - AWS: an IAM role trusting token.actions.githubusercontent.com for this
#     repo, allowed s3:PutObject on the bucket and cloudfront:CreateInvalidation.
# The signing PFX is the one secret, because signtool needs the key on the runner.

name: BootstrapMate to Intune (S3 manifest)

on:
  workflow_dispatch:
    inputs:
      bootstrapMateTag:
        description: 'BootstrapMate release tag (bootstrapmate/bootstrapmate-windows), or latest'
        type: string
        default: latest
      assignmentGroupId:
        description: 'Entra group object ID to assign the Win32 app to'
        type: string
        default: '<entra-group-object-id>'
      espName:
        description: 'ESP profile that should block on BootstrapMate (empty to skip)'
        type: string
        default: 'Management Bootstrap'

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Fetch + sign BootstrapMate, build .intunewin
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Fetch BootstrapMate x64 MSI
      shell: pwsh
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        . ./pipelines/scripts/GitHubRelease.ps1
        $got = Get-GitHubReleaseAsset -Owner 'bootstrapmate' -Repo 'bootstrapmate-windows' `
          -Tag '${{ inputs.bootstrapMateTag }}' -AssetGlob 'BootstrapMate-x64-*.msi' -DestDir "$env:RUNNER_TEMP\intune"
        "MSI_PATH=$($got.Path)" | Out-File -Append $env:GITHUB_ENV
        Write-Host "Fetched $($got.Name) from $($got.Tag)"

    - name: Sign BootstrapMate MSI
      shell: pwsh
      env:
        SIGNING_PFX_B64:      ${{ secrets.SIGNING_PFX_B64 }}
        SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
      run: |
        $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
        [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_B64))
        $pw = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
        try { $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $pw }
        finally { Remove-Item $pfx -Force }

        $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin' -Recurse -Filter signtool.exe |
          Where-Object FullName -like '*\x64\*' | Sort-Object FullName -Descending | Select-Object -First 1
        if (-not $signtool) { throw 'signtool.exe not found on the runner' }

        # A timestamp server that is down fails the sign; try the next one.
        $signed = $false
        foreach ($tsa in 'http://timestamp.digicert.com', 'http://timestamp.sectigo.com', 'http://timestamp.globalsign.com/tsa/r6advanced1') {
          & $signtool.FullName sign /sha1 $cert.Thumbprint /fd SHA256 /tr $tsa /td SHA256 /q $env:MSI_PATH
          if ($LASTEXITCODE -eq 0) { $signed = $true; Write-Host "Signed, timestamped by $tsa"; break }
          Write-Host "signtool failed with $tsa ($LASTEXITCODE); trying the next server"
        }
        if (-not $signed) { throw 'Signing failed against every timestamp server' }

    - name: Build .intunewin
      shell: pwsh
      run: |
        $tool = "$env:RUNNER_TEMP\IntuneWinAppUtil.exe"
        Invoke-WebRequest -UseBasicParsing -OutFile $tool `
          'https://github.com/microsoft/Microsoft-Win32-Content-Prep-Tool/raw/master/IntuneWinAppUtil.exe'
        $msi = Get-Item $env:MSI_PATH
        & $tool -c $msi.DirectoryName -s $msi.FullName -o $msi.DirectoryName -q
        if ($LASTEXITCODE -ne 0) { throw "IntuneWinAppUtil failed ($LASTEXITCODE)" }

    - uses: actions/upload-artifact@v4
      with:
        name: bootstrapmate-intune
        path: ${{ runner.temp }}/intune

  publish-manifest:
    name: Upload management.json to S3 + invalidate CloudFront
    runs-on: windows-latest
    env:
      S3_BUCKET: ${{ vars.S3_BUCKET }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      MANAGEMENT_JSON_URL: ${{ vars.MANAGEMENT_JSON_URL }}   # e.g. https://cimian.example.com/bootstrap/management.json
    steps:
    - uses: actions/checkout@v4

    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ vars.AWS_ROLE_ARN }}
        aws-region: ${{ vars.AWS_REGION }}

    - name: Upload management.json and invalidate
      shell: pwsh
      run: |
        # The first-boot manifest BootstrapMate reads at the ESP. See
        # provisioning/README.md.
        $manifest = 'provisioning/public/management.json'
        Get-Content $manifest -Raw | ConvertFrom-Json | Out-Null   # refuse to publish invalid JSON
        for ($try = 1; ; $try++) {
          aws s3 cp $manifest "s3://$env:S3_BUCKET/bootstrap/management.json" --content-type 'application/json'
          if ($LASTEXITCODE -eq 0) { break }
          if ($try -ge 4) { throw "management.json upload failed after $try attempts" }
          Start-Sleep -Seconds (10 * $try)
        }
        aws cloudfront create-invalidation --distribution-id $env:CLOUDFRONT_DISTRIBUTION_ID --paths '/bootstrap/management.json'
        if ($LASTEXITCODE -ne 0) { throw "CloudFront invalidation failed ($LASTEXITCODE)" }

  deploy:
    name: Win32 LOB to Intune + assign + ESP
    runs-on: windows-latest
    needs: build
    steps:
    - uses: actions/checkout@v4

    - uses: actions/download-artifact@v4
      with:
        name: bootstrapmate-intune
        path: ${{ runner.temp }}/intune

    - name: Azure login (OIDC)
      uses: azure/login@v2
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        allow-no-subscriptions: true

    - name: Publish Win32 LOB
      shell: pwsh
      run: |
        $token = az account get-access-token --resource 'https://graph.microsoft.com' --query accessToken -o tsv
        $intuneWin = Get-ChildItem "$env:RUNNER_TEMP\intune" -Filter '*.intunewin' -Recurse | Select-Object -First 1
        if (-not $intuneWin) { throw 'No .intunewin in the build artifact' }
        ./pipelines/scripts/Publish-IntuneWin32App.ps1 -Token $token -IntuneWin $intuneWin.FullName `
          -DisplayName 'BootstrapMate' -AssignmentGroupId '${{ inputs.assignmentGroupId }}' -EspName '${{ inputs.espName }}'
