# infrastructure.yml — check and apply ../../infrastructure with Terraform.
#
# GitHub Actions twin of pipelines/azure/infrastructure.yml. Copy it to
# .github/workflows/ in your Cimian repo.
#
# Two jobs, split by trust:
#   check  Every pull request and push. fmt and validate with
#          `init -backend=false`. No cloud credential, no state: a pull request
#          can rewrite this file, so it must not be able to reach anything that
#          holds secrets.
#   apply  main only, in the "cimian-infrastructure" environment. Add required
#          reviewers to that environment (Settings > Environments). The job
#          plans and applies in one go. The plan holds the client token and SAS
#          in plain text, so it is never uploaded as an artifact.
#
# Auth is OpenID Connect: ARM_USE_OIDC makes the azurerm provider and backend
# exchange the job's GitHub token for an Entra token. Create exactly one
# federated credential, for repo:<owner>/<repo>:environment:cimian-infrastructure.
# Never give a pull_request subject access to state or Key Vault.
#
# Third-party actions are pinned to full commit SHAs, with the release in a
# trailing comment. Update both together.

name: Cimian infrastructure

on:
  pull_request:
    paths: ['infrastructure/**']
  push:
    branches: [main]
    paths: ['infrastructure/**']
  schedule:
    - cron: '0 6 1 * *'   # reissue the client SAS before it nears expiry
  workflow_dispatch:

concurrency:
  group: cimian-infrastructure
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_VERSION: '1.9.8'
  TF_IN_AUTOMATION: 'true'

defaults:
  run:
    working-directory: infrastructure

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Format, init without backend, validate
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  apply:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: cimian-infrastructure   # add required reviewers here
    permissions:
      contents: read
      id-token: write
    env:
      ARM_USE_OIDC: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      STATE_RG: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      STATE_SA: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      STATE_CONTAINER: tfstate
      STATE_KEY: cimian.tfstate
      TF_VAR_pipeline_principal_id: ${{ vars.PIPELINE_PRINCIPAL_ID }}
      TF_VAR_storage_account_name: ${{ vars.STORAGE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Init
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=$STATE_RG" \
            -backend-config="storage_account_name=$STATE_SA" \
            -backend-config="container_name=$STATE_CONTAINER" \
            -backend-config="key=$STATE_KEY"

      # The environment's reviewers approve the run before this job starts;
      # the plan printed here is the record of what was applied. Sensitive
      # values print as (sensitive value). The plan file stays on the runner.
      - name: Plan and apply
        run: |
          set +e
          terraform plan -input=false -lock-timeout=300s -detailed-exitcode -out="$RUNNER_TEMP/tfplan"
          rc=$?
          set -e
          case $rc in
            0) echo "No changes." ;;
            2) terraform apply -input=false -lock-timeout=300s "$RUNNER_TEMP/tfplan" ;;
            *) exit $rc ;;
          esac
          rm -f "$RUNNER_TEMP/tfplan"
