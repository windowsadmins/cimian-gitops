# promote-catalogs.yml — GitHub Actions twin of ../azure/promote-catalogs.yml.
#
# A weekday preview that reports what would move, then a promotion run that
# edits catalogs with promotion/promoter.py and commits to main. That commit
# triggers push-to-production like any other deployment/** change.
#
# The commit is pushed with GITHUB_TOKEN. If main is protected, allow
# github-actions to bypass it, or change the last step to push a branch and
# open a pull request. Note that a push made with GITHUB_TOKEN does not start
# other workflows; use a GitHub App token here if push-to-production should run
# on the promotion commit without a manual dispatch.

name: Promote catalogs

on:
  schedule:
    - cron: '30 14 * * 1-5'   # preview
    - cron: '0 18 * * 1-5'    # promote
  workflow_dispatch:
    inputs:
      promotion:
        description: 'Promotion to run (a name from promoter.yml, or all)'
        type: string
        default: all
      preview:
        description: 'Preview only (dry run)'
        type: boolean
        default: false

concurrency:
  group: promote-catalogs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - run: python -m pip install --quiet pyyaml

      - name: Run promoter
        env:
          SCHEDULE: ${{ github.event.schedule }}
          PREVIEW_INPUT: ${{ inputs.preview }}
          PROMOTION: ${{ inputs.promotion || 'all' }}
        run: |
          set -euo pipefail
          if [[ ! "$PROMOTION" =~ ^[A-Za-z0-9\ _-]+$ ]]; then
            echo "::error::promotion '$PROMOTION' has unexpected characters"; exit 1
          fi
          mode=promote
          if [[ "$PREVIEW_INPUT" == "true" || "$SCHEDULE" == "30 14 * * 1-5" ]]; then mode=preview; fi
          echo "RUN_MODE=$mode" >> "$GITHUB_ENV"
          echo "Run mode: $mode"

          args=(--pkgsinfo deployment/pkgsinfo/apps --yaml promotion/promoter.yml --markdown "$RUNNER_TEMP/promotions.md" --auto)
          [[ "$mode" == "preview" ]] && args+=(--dry-run --as-of 18)
          [[ "$PROMOTION" != "all" ]] && args+=(-p "$PROMOTION")
          python promotion/promoter.py "${args[@]}"
          if [[ -f "$RUNNER_TEMP/promotions.md" ]]; then cat "$RUNNER_TEMP/promotions.md" >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Commit promotions
        if: env.RUN_MODE == 'promote'
        run: |
          set -euo pipefail
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add -A deployment/pkgsinfo
          if git diff --cached --quiet; then echo "Nothing to commit."; exit 0; fi
          git commit -qm "Catalog promotion $(date -u +%Y-%m-%d)"
          for try in 1 2 3; do
            git pull --rebase -q origin main && git push origin HEAD:main && exit 0
            sleep $((try * 10))
          done
          echo "::error::Could not push the promotion commit"; exit 1
