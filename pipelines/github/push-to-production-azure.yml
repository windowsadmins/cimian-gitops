# push-to-production-azure.yml — publish the Cimian repo to Azure Blob + Front Door.
#
# GitHub Actions twin of pipelines/azure/push-to-production-azure.yml. Copy it to
# .github/workflows/ in your Cimian repo.
#
# Auth is OpenID Connect federation: azure/login exchanges the job's GitHub
# token for an Entra token, so there is no client secret and no stored SAS to
# rotate. Create a federated credential on the app registration (or user-
# assigned managed identity) for repo:<owner>/<repo>:ref:refs/heads/main, and
# grant it Storage Blob Data Contributor on the storage account and CDN Endpoint
# Contributor on the Front Door profile. AZURE_CLIENT_ID, AZURE_TENANT_ID and
# AZURE_SUBSCRIPTION_ID are identifiers, not secrets, so they live in repository
# variables.

name: Cimian push to production (Azure)

on:
  push:
    branches: [main]
    paths: ['deployment/**', 'installers/**']
  workflow_dispatch:

# One run at a time, and never cancel one mid-upload. Two overlapping runs can
# finish out of order and leave the CDN serving the older catalogs.
concurrency:
  group: cimian-push-production
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  STORAGE_ACCOUNT: ${{ vars.STORAGE_ACCOUNT }}       # e.g. examplecimianstorage
  STORAGE_CONTAINER: ${{ vars.STORAGE_CONTAINER }}   # e.g. repo
  FD_RESOURCE_GROUP: ${{ vars.FD_RESOURCE_GROUP }}
  FD_PROFILE: ${{ vars.FD_PROFILE }}
  FD_ENDPOINT: ${{ vars.FD_ENDPOINT }}
  # The windowsadmins/cimian release the catalog tools come from. Pinned, so a
  # new makecatalogs only reaches production through a reviewed edit.
  CIMIAN_TOOLS_TAG: '2026.09.18.1356'
  # SHA-256 of that release's CimianTools-x64 nupkg. Change it with the tag.
  CIMIAN_TOOLS_SHA256: 'e6824a09095e4d1f86cff99469bb96f49b5b597fdbbab157139e97b933b73f71'

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned makecatalogs
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./pipelines/scripts/Install-CimianTools.ps1 -Tag $env:CIMIAN_TOOLS_TAG -Sha256 $env:CIMIAN_TOOLS_SHA256 -Destination "$env:RUNNER_TEMP/cimian-tools" -Tools makecatalogs.exe

      - name: Run makecatalogs
        shell: pwsh
        run: |
          & "$env:RUNNER_TEMP/cimian-tools/makecatalogs.exe" --repo_path "$env:GITHUB_WORKSPACE/deployment"
          if ($LASTEXITCODE -ne 0) { throw "makecatalogs failed ($LASTEXITCODE)" }
          if (-not (Get-ChildItem deployment/catalogs -Filter *.yaml -ErrorAction SilentlyContinue)) {
            throw 'makecatalogs wrote no catalogs'
          }

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: 'Gate: every pkgsinfo location exists in blob'
        shell: pwsh
        run: |
          $inv = Join-Path $env:RUNNER_TEMP 'pkgs-inventory.txt'
          az storage blob list --auth-mode login `
            --account-name $env:STORAGE_ACCOUNT --container-name $env:STORAGE_CONTAINER `
            --prefix 'deployment/pkgs/' --num-results '*' --query '[].name' -o tsv > $inv
          if ($LASTEXITCODE -ne 0) { throw 'Could not list deployment/pkgs; the identity needs Storage Blob Data Reader or better.' }
          ./pipelines/scripts/Test-PackagesPresent.ps1 -RepoPath deployment -InventoryFile $inv

      # Sync-RepoToBlob mints a short-lived user-delegation SAS from the OIDC
      # login and runs azcopy with it; see the script for why.
      - name: Sync to Azure Blob
        shell: pwsh
        run: ./pipelines/scripts/Sync-RepoToBlob.ps1 -StorageAccount $env:STORAGE_ACCOUNT -Container $env:STORAGE_CONTAINER -RepoRoot $env:GITHUB_WORKSPACE

      # Never purge /deployment/pkgs/*: packages are version-named and never
      # stale at the edge.
      - name: Purge Front Door (metadata only)
        shell: pwsh
        run: |
          az afd endpoint purge `
            --resource-group $env:FD_RESOURCE_GROUP `
            --profile-name $env:FD_PROFILE `
            --endpoint-name $env:FD_ENDPOINT `
            --content-paths '/deployment/catalogs/*' '/deployment/manifests/*' '/deployment/pkgsinfo/*' '/deployment/icons/*' `
            --no-wait
          if ($LASTEXITCODE -ne 0) { throw "az afd endpoint purge failed ($LASTEXITCODE)" }
